{% extends "base.html" %}

{% block title %}Login | Tagbandhu{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-card">
        <a href="/" class="auth-logo">Tag<span>bandhu</span></a>

        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login to your account</h1>
        <p class="auth-description">
            Manage your tags and keep your belongings connected.
        </p>

        <form action="{{ url_for('login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next_url }}">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>


            <label for="password">Password</label>

            <div class="password-field">
                <input type="password" id="password" name="password" placeholder="Enter your password" required>

                <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password"
                    aria-pressed="false">

                    <svg id="password-eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>

                </button>
            </div>


            <button type="submit" class="auth-button">Login</button>
        </form>

        <p class="auth-switch">
            Don't have an account?
            <a href="/register">Create one</a>
        </p>

        <a href="/" class="back-link">← Back to home</a>
    </div>
</section>

<script>
(function () {
    const passwordInput = document.getElementById("password");
    const toggleButton = document.getElementById("toggle-password");
    const eyeIconElement = document.getElementById("password-eye-icon");

    const eyeIcon = `
        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
        <circle cx="12" cy="12" r="3"/>
    `;

    const eyeOffIcon = `
        <path d="M3 3l18 18"/>
        <path d="M10.6 5.1A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16.7 16.7 0 0 1-4 4.8"/>
        <path d="M6.6 6.6C3.6 8.5 2 12 2 12s3.6 7 10 7a10.5 10.5 0 0 0 4-.8"/>
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
    `;

    toggleButton.addEventListener("click", function () {
        const showPassword = passwordInput.type === "password";

        passwordInput.type = showPassword ? "text" : "password";
        eyeIconElement.innerHTML = showPassword ? eyeOffIcon : eyeIcon;

        toggleButton.setAttribute(
            "aria-label",
            showPassword ? "Hide password" : "Show password"
        );

        toggleButton.setAttribute("aria-pressed", String(showPassword));
    });
})();
</script>

{% endblock %}
